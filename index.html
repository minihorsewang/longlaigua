<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>龍來刮</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-top">
      <a href="#home" class="logo"><span class="cat-photo cat-photo-logo" aria-hidden="true"></span>龍來刮</a>

      <nav class="main-nav" aria-label="主選單">
        <a href="#events" data-page="events">
          <svg class="ico" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>活動
        </a>
        <a href="#products" data-page="products">
          <svg class="ico" viewBox="0 0 24 24"><path d="M6 7h12l1 14H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>商品
        </a>
        <a href="#winners" data-page="winners">
          <svg class="ico" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M16 5h3v2a3 3 0 0 1-3 3M8 5H5v2a3 3 0 0 0 3 3M12 13v4M8 21h8M9 17h6"/></svg>中獎
        </a>
        <a href="#mini" data-page="mini">
          <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>小程式
        </a>
        <a href="#member" data-page="member">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>會員
        </a>
      </nav>

      <button class="cart-link" data-action="open-cart" aria-label="購物車">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
        <span class="cart-text">購物車</span>
        <span class="cart-count" id="cart-count" hidden></span>
      </button>
    </div>

    <div class="header-sub">
      <div class="container header-sub-inner">
        <button class="drawer-toggle" data-action="open-drawer">
          <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="3"/><rect x="4" y="14" width="6" height="6" rx="3"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>產品選單
        </button>
        <div class="announce">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h3l5 4V6L7 10H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <div class="announce-track"><div class="announce-items" id="announce"></div></div>
        </div>
        <form class="search search-header" role="search">
          <input type="search" name="q" placeholder="搜尋商品" aria-label="搜尋商品">
          <button type="submit" aria-label="搜尋">
            <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          </button>
        </form>
      </div>
    </div>
  </header>

  <!-- 左側直式「產品選單」標籤：固定在畫面左緣 -->
  <button class="side-tab" data-action="open-drawer">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="3"/><rect x="4" y="14" width="6" height="6" rx="3"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
    <span>產品選單</span>
  </button>

  <!-- 全螢幕產品選單 -->
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="產品選單" inert>
    <div class="drawer-strip">
      <button class="drawer-close" data-action="close-drawer">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        <span>關閉選單</span>
      </button>
      <div class="strip-brand" aria-hidden="true">LUCKY SCRATCH</div>
      <div class="strip-foot" aria-hidden="true">SINCE 2026</div>
    </div>
    <div class="drawer-main">
      <div class="drawer-top">
        <nav class="drawer-tabs" id="drawer-tabs" aria-label="產品分類"></nav>
        <form class="search search-drawer" role="search">
          <input type="search" name="q" placeholder="搜尋商品" aria-label="搜尋商品">
          <button type="submit" aria-label="搜尋">
            <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          </button>
        </form>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>
  </div>

  <!-- 右側購物車 -->
  <div class="cart-backdrop" data-action="close-cart"></div>
  <aside class="cart-drawer" id="cart-drawer" role="dialog" aria-modal="true" aria-label="購物車" inert>
    <div class="cart-head">
      <h2>購物車<small id="cart-head-count"></small></h2>
      <button class="icon-btn" data-action="close-cart" aria-label="關閉購物車">
        <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="cart-body" id="cart-body"></div>
    <div class="cart-foot" id="cart-foot" hidden></div>
  </aside>

  <main class="container">
    <section class="page" id="page-home"></section>
    <section class="page" id="page-events" hidden></section>
    <section class="page" id="page-products" hidden></section>
    <section class="page" id="page-winners" hidden></section>
    <section class="page" id="page-mini" hidden></section>
    <section class="page" id="page-order" hidden></section>
    <section class="page" id="page-pickup" hidden></section>
    <section class="page" id="page-member" hidden></section>
  </main>

  <footer class="site-footer">
    <div class="container"><strong>龍來刮 · 貓貓的好運小舖</strong><br><span>把可愛帶回家，把好運刮出來。</span><br><small>© 2026 龍來刮 · 本網站為示範版本</small></div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
